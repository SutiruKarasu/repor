<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clock Inn Quiz X</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- BACKGROUND GEARS -->
<div class="background-gears">

<div class="gear gear1"></div>
<div class="gear gear2"></div>
<div class="gear gear3"></div>
<div class="gear gear4"></div>

</div>

<div id="app">

<!-- START SCREEN -->
<section id="start-screen" class="screen active">

<div class="login-card">

<div class="logo-container">

<h1 class="logo-text">
CLOCK-INN
</h1>

<p class="logo-sub">
QUIZ X EDITION
</p>

</div>

<div class="intro-text">

<p>60 Questions. 6 Categories. 10 Seconds.</p>

<p class="highlight">
Precision is everything.
</p>

</div>

<div class="input-group">

<input
type="text"
id="player-name"
placeholder="Enter your name..."
autocomplete="off"
/>

</div>

<button
id="start-btn"
class="primary-btn"
>
CLOCK IN
</button>

</div>

</section>

<!-- QUIZ -->
<section id="quiz-screen" class="screen">

<header class="quiz-header">

<span id="topic-display"></span>

<span id="streak-badge"></span>

<span id="question-counter"></span>

</header>

<!-- TIMER -->
<div class="timer-section">

<div class="timer-ring">

<div id="clock-hand"></div>

<span id="time-display">
10
</span>

</div>

</div>

<!-- ALL OR NOTHING -->
<div
id="all-or-nothing"
class="all-or-nothing"
>

⚠ ALL OR NOTHING ⚠
<br>
2X POINTS ACTIVATED

</div>

<!-- QUESTION -->
<div class="question-section">

<h2 id="question-text"></h2>

</div>

<!-- ANSWERS -->
<div
id="answers-container"
class="options-section"
></div>

<!-- SCORE -->
<div class="score-section">

<p>SCORE</p>

<div
id="score-container"
class="score-container"
>

<span id="score-display">
0
</span>

</div>

</div>

</section>

<!-- RESULT -->
<section
id="result-screen"
class="screen"
>

<div class="login-card result-card">

<h2>
SHIFT COMPLETE
</h2>

<h3
id="result-name"
class="result-name"
></h3>

<div class="stats-box">

<p>
Final Score:
<span id="final-score"></span>
</p>

<p>
Max Streak:
<span id="final-streak"></span>
</p>

</div>

</div>

</section>

</div>

<!-- SOUND -->
<audio
id="tick-sound"
preload="auto"
>

<source
src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"
type="audio/mpeg"
/>

</audio>

<script src="script.js"></script>

</body>
</html>
